services:
  - type: web
    name: firststep
    runtime: docker
    plan: starter            # persistent disks need a paid instance; free tier works without the disk (data resets)
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/firststep.db
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      - key: MAX_SUBMITS_PER_DAY
        value: "60"
      - key: LLM_PROVIDER
        value: none           # public demo stays model-free
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PRO_CODES
        sync: false           # set JUDGE-DEMO-2026 in Render dashboard